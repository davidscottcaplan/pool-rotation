<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool Schedule — Select a Pool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #eef2f7;
      color: #2d3748;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 520px;
    }
    .back {
      display: inline-block;
      font-size: 0.82rem;
      color: #2b6cb0;
      text-decoration: none;
      margin-bottom: 1.25rem;
    }
    .back:hover { text-decoration: underline; }
    h1 { font-size: 1.3rem; font-weight: 700; color: #1a365d; margin-bottom: 0.3rem; }
    .subtitle { font-size: 0.88rem; color: #718096; margin-bottom: 1.5rem; }
    .pool-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .pool-btn {
      display: block;
      padding: 0.85rem 1.1rem;
      background: #ebf4ff;
      border: 1px solid #bee3f8;
      border-radius: 8px;
      text-decoration: none;
      color: #2b6cb0;
      font-weight: 500;
      font-size: 0.95rem;
      transition: background 0.12s;
    }
    .pool-btn:hover { background: #bee3f8; }
  </style>
</head>
<body>

<div class="card">
  <a class="back" href="/">← Search again</a>
  <h1>{{ site.calendar_name }}</h1>
  <p class="subtitle">{{ slug }} · {{ site.centers | length }} pool{{ 's' if site.centers | length != 1 }} found — select one to view its schedule.</p>

  <div class="pool-list">
    {% for c in site.centers %}
    <a class="pool-btn" href="/schedule?site={{ slug }}&pool={{ c.id }}">
      {{ c.name }}
    </a>
    {% endfor %}
  </div>
</div>

</body>
</html>
